<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inclusão de Novo Usuário - GLPI SIGPEC</title>
    <style>
        /* ===== RESET E BASE ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #F5F7FB;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* ===== MENU LATERAL ===== */
        .menu-lateral {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            padding: 34px 22px;
            gap: 652px;
            width: 162px;
            height: 100vh;
            background: #1A397A;
            flex-shrink: 0;
        }
        .menu-lateral .requisicoes {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 17px;
            width: 118px;
        }
        .menu-lateral .requisicoes .item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            width: 100%;
            color: #FFFFFF;
            font-size: 13px;
            line-height: 16px;
            cursor: pointer;
            text-decoration: none;
        }
        .menu-lateral .requisicoes .item svg {
            width: 18px;
            height: 18px;
            fill: #FFFFFF;
        }
        .menu-lateral .recolher {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #FFFFFF;
            font-size: 14px;
            line-height: 17px;
            cursor: pointer;
        }
        /* ===== CONTEÚDO ===== */
        .conteudo {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 20px 20px 20px;
            overflow-y: auto;
            height: 100vh;
        }
        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 12px 13px;
            background: #FFFFFF;
            width: 100%;
            flex-shrink: 0;
            margin-bottom: 20px;
        }
        .cabecalho .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #000;
        }
        .cabecalho .breadcrumb .home-icon { width: 18px; height: 18px; }
        .cabecalho .usuario-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #000;
            cursor: pointer;
        }
        /* ===== FORMULÁRIO ===== */
        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .form-card {
            background: #FFFFFF;
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 600px;
            border-radius: 4px;
            overflow: hidden;
        }
        .form-card .titulo {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 24px 8px 24px;
            font-size: 26px;
            font-weight: 600;
            color: #000;
        }
        .form-card .titulo svg {
            width: 40px;
            height: 40px;
            fill: #1C1B1F;
        }
        .form-card .dados-chamado {
            background: #F5F7FC;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 8px 24px;
            font-size: 16px;
            color: #3B73A7;
            font-weight: 400;
        }
        .form-card .campo {
            padding: 12px 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-card .campo label {
            font-weight: 600;
            font-size: 13px;
            color: #000;
        }
        .form-card .campo label .obrigatorio {
            color: #d32f2f;
            margin-left: 2px;
        }
        .form-card .campo input,
        .form-card .campo select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #D9DBDE;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            background: #FFFFFF;
        }
        .form-card .campo .aviso {
            font-size: 11px;
            color: #d32f2f;
            margin-top: 2px;
        }
        .form-card .campo .helper {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }
        .form-card .campo .helper .icone-aviso {
            color: #f57c00;
        }
        .form-card .campo-radio {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 4px 0;
        }
        .form-card .campo-radio label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 400;
            font-size: 13px;
            color: #000;
            cursor: pointer;
        }
        .form-card .campo-radio input[type="radio"] {
            width: 16px;
            height: 16px;
            accent-color: #5B5083;
            cursor: pointer;
        }
        .form-card .acoes {
            padding: 16px 24px;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #eee;
        }
        .btn-enviar {
            background: #FFFFFF;
            border: 1px solid #D9D9D9;
            border-radius: 4px;
            padding: 8px 24px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: #000;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-enviar:hover {
            background: #f0f0f0;
        }
        .campo-identificacao {
            transition: all 0.2s;
        }

        /* ===== COMPONENTE DE SELEÇÃO MÚLTIPLA (TAGS) ===== */
        .multiselect-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .multiselect-control {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .multiselect-control select {
            flex: 1;
            height: 36px;
            padding: 4px 8px;
            border: 1px solid #D9DBDE;
            border-radius: 4px;
            font-size: 13px;
            background: #FFFFFF;
        }
        .multiselect-control button {
            height: 36px;
            padding: 0 16px;
            background: #5B5083;
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .multiselect-control button:hover {
            background: #4a3f6e;
        }
        .multiselect-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 6px 8px;
            min-height: 36px;
            border: 1px solid #D9DBDE;
            border-radius: 4px;
            background: #FAFBFC;
        }
        .multiselect-tags .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #E7E7E7;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            color: #000;
        }
        .multiselect-tags .tag .remove {
            cursor: pointer;
            font-weight: bold;
            color: #999;
            font-size: 14px;
            line-height: 1;
        }
        .multiselect-tags .tag .remove:hover {
            color: #d32f2f;
        }
        .multiselect-tags .vazio {
            color: #999;
            font-size: 13px;
        }

        /* ===== MODAL PERSONALIZADO (CENTRALIZADO) ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(3px);
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 40px 35px 30px;
            max-width: 580px;
            width: 92%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeInUp 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-content .icone-sucesso {
            font-size: 56px;
            margin-bottom: 12px;
            display: block;
        }
        .modal-content h2 {
            font-size: 26px;
            font-weight: 700;
            color: #1A397A;
            margin-bottom: 12px;
        }
        .modal-content .mensagem-modal {
            background: #F5F7FC;
            border-radius: 8px;
            padding: 18px 20px;
            text-align: left;
            font-size: 14px;
            line-height: 1.7;
            color: #222;
            margin: 16px 0 24px;
            border-left: 4px solid #5B5083;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Inter', sans-serif;
        }
        .modal-content .btn-modal {
            background: #1A397A;
            color: #FFFFFF;
            border: none;
            padding: 12px 48px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: 'Inter', sans-serif;
        }
        .modal-content .btn-modal:hover {
            background: #0e295e;
        }
        .modal-content .btn-modal:active {
            transform: scale(0.97);
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 480px) {
            .menu-lateral { width: 60px; padding: 20px 10px; }
            .menu-lateral .requisicoes .item span { display: none; }
            .menu-lateral .recolher span { display: none; }
            .multiselect-control { flex-wrap: wrap; }
            .multiselect-control select { flex: 1 1 100%; }
            .multiselect-control button { flex: 1; }
            .modal-content { padding: 28px 18px; }
            .modal-content h2 { font-size: 22px; }
            .modal-content .btn-modal { padding: 10px 32px; font-size: 16px; }
        }
    </style>
</head>
<body>

<!-- ===== MENU LATERAL ===== -->
<div class="menu-lateral">
    <div class="requisicoes">
        <a href="../dashboard.html" class="item">
            <svg viewBox="0 0 24 24"><path d="M12 1C7.58 1 4 4.58 4 9v3c0 4.42 3.58 8 8 8s8-3.58 8-8v-3c0-4.42-3.58-8-8-8zm0 2c3.31 0 6 2.69 6 6v3c0 3.31-2.69 6-6 6s-6-2.69-6-6v-3c0-3.31 2.69-6 6-6z"/></svg>
            <span>Serviços</span>
        </a>
        <a href="../meus-chamados.html" class="item">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
            <span>Meus Chamados</span>
        </a>
        <div class="item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span>FAQ</span>
        </div>
        <div class="item">
            <svg viewBox="0 0 24 24"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/></svg>
            <span>Reservas</span>
        </div>
    </div>
    <div class="recolher">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M11.67 3.87L9.9 2.1 0 12l9.9 9.9 1.77-1.77L3.54 12z"/></svg>
        <span>Recolher Menu</span>
    </div>
</div>

<!-- ===== CONTEÚDO ===== -->
<div class="conteudo">

    <!-- Cabeçalho -->
    <div class="cabecalho">
        <div class="breadcrumb">
            <svg class="home-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home /</span>
            <span style="color:#000;">Serviços / Inclusão de Novo Usuário</span>
        </div>
        <div class="usuario-dropdown">
            <span>Usuário</span>
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
    </div>

    <!-- Formulário -->
    <div class="form-container">
        <div class="form-card">
            <!-- Título -->
            <div class="titulo">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Inclusão de Novo Usuário
            </div>
            <div class="dados-chamado">Dados do Chamado</div>

            <!-- Tipo de Usuário -->
            <div class="campo">
                <label>Tipo de Usuário <span class="obrigatorio">*</span></label>
                <div class="campo-radio" id="tipoUsuario">
                    <label><input type="radio" name="tipo" value="Servidor" checked /> Servidor</label>
                    <label><input type="radio" name="tipo" value="Estagiario" /> Estagiário</label>
                    <label><input type="radio" name="tipo" value="Residente" /> Residente</label>
                    <label><input type="radio" name="tipo" value="Terceirizado" /> Terceirizado</label>
                </div>
            </div>

            <!-- Nome Completo -->
            <div class="campo">
                <label for="nome">Nome Completo <span class="obrigatorio">*</span></label>
                <input type="text" id="nome" placeholder="Digite o nome completo" />
            </div>

            <!-- Campo de identificação (dinâmico) -->
            <div class="campo campo-identificacao" id="campoIdentificacao">
                <label for="identificacao" id="labelIdentificacao">Registro Funcional (RF)<span class="obrigatorio">*</span></label>
                <input type="text" id="identificacao" placeholder="Digite o registro ou vínculo" />
                <div class="helper" id="helperIdentificacao"></div>
            </div>

            <!-- Justificativa para Dados do Usuário -->
            <div class="campo">
                <label for="justificativaUsuario">Justificativa para Inclusão do Usuário <span class="obrigatorio">*</span></label>
                <input type="text" id="justificativaUsuario" placeholder="Descreva a justificativa para os dados do usuário" />
            </div>

            <!-- Padrão de Acesso (multiselect com tags) -->
            <div class="campo">
                <label>Padrão de Acesso <span class="obrigatorio">*</span></label>
                <div class="multiselect-wrapper" id="multiselectContainerPadrao">
                    <div class="multiselect-control">
                        <select id="selectPadrao">
                            <option value="">Selecione um padrão</option>
                        </select>
                        <button type="button" id="btnAdicionarPadrao">Adicionar</button>
                    </div>
                    <div class="multiselect-tags" id="tagsContainerPadrao">
                        <span class="vazio">Nenhum padrão selecionado</span>
                    </div>
                </div>
                <input type="hidden" id="padroesSelecionados" value="" />
            </div>

            <!-- Justificativa para Padrão de Acesso -->
            <div class="campo">
                <label for="justificativaPadrao">Justificativa para Padrão de Acesso <span class="obrigatorio">*</span></label>
                <input type="text" id="justificativaPadrao" placeholder="Descreva a justificativa para o padrão de acesso" />
            </div>

            <!-- Perfil de Setor (multiselect com tags) -->
            <div class="campo">
                <label>Perfil de Setor <span class="obrigatorio">*</span></label>
                <div class="multiselect-wrapper" id="multiselectContainerPerfil">
                    <div class="multiselect-control">
                        <select id="selectPerfil">
                            <option value="">Selecione um perfil</option>
                        </select>
                        <button type="button" id="btnAdicionarPerfil">Adicionar</button>
                    </div>
                    <div class="multiselect-tags" id="tagsContainerPerfil">
                        <span class="vazio">Nenhum perfil selecionado</span>
                    </div>
                </div>
                <input type="hidden" id="perfisSelecionados" value="" />
            </div>

            <!-- Justificativa para Perfil de Setor -->
            <div class="campo">
                <label for="justificativaPerfil">Justificativa para Perfil de Setor <span class="obrigatorio">*</span></label>
                <input type="text" id="justificativaPerfil" placeholder="Descreva a justificativa para o perfil de setor" />
            </div>

            <!-- Botão Enviar -->
            <div class="acoes">
                <button class="btn-enviar" id="btnEnviar">Enviar</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== MODAL PERSONALIZADO ===== -->
<div class="modal-overlay" id="modalSucesso">
    <div class="modal-content">
        <span class="icone-sucesso">✅</span>
        <h2>Chamado Enviado com Sucesso!</h2>
        <div class="mensagem-modal" id="modalMensagem"></div>
        <button class="btn-modal" id="btnModalOk">OK</button>
    </div>
</div>

<script>
    // ===== LISTAS DE DADOS =====
    const padroes = [
        "BASICO", "CONSULTA_GERAL", "Ergon", "AHM_PARCELAMEN", "CADASTRO",
        "DEBITOS", "FOLHA_UNIDADES", "APOS/EXONER", "SEG HOLERITE", "AUX_FUNERAL",
        "ACESSO_WEB"
    ];

    const perfis = [
        "CMSP", "GERAL", "IPREM", "PENSIONISTA", "SFMSP", "TCMSP",
        "AHM_GERAL", "MUNICIPALIZADOS", "SMS", "IPREM_APOS", "APOS_SME",
        "SME", "AFASTADOS", "AHM-JSH", "AMLURB"
    ];

    // ===== ELEMENTOS =====
    const radios = document.querySelectorAll('input[name="tipo"]');
    const campoIdentificacao = document.getElementById('campoIdentificacao');
    const labelIdentificacao = document.getElementById('labelIdentificacao');
    const inputIdentificacao = document.getElementById('identificacao');
    const helperIdentificacao = document.getElementById('helperIdentificacao');

    const selectPadrao = document.getElementById('selectPadrao');
    const btnAdicionarPadrao = document.getElementById('btnAdicionarPadrao');
    const tagsContainerPadrao = document.getElementById('tagsContainerPadrao');
    const hiddenPadroes = document.getElementById('padroesSelecionados');

    const selectPerfil = document.getElementById('selectPerfil');
    const btnAdicionarPerfil = document.getElementById('btnAdicionarPerfil');
    const tagsContainerPerfil = document.getElementById('tagsContainerPerfil');
    const hiddenPerfis = document.getElementById('perfisSelecionados');

    // ===== POPULAR SELECTS =====
    function popularSelect(select, opcoes) {
        select.innerHTML = '';
        const optDefault = document.createElement('option');
        optDefault.value = '';
        optDefault.textContent = 'Selecione...';
        select.appendChild(optDefault);
        opcoes.forEach(op => {
            const opt = document.createElement('option');
            opt.value = op;
            opt.textContent = op;
            select.appendChild(opt);
        });
    }

    popularSelect(selectPadrao, padroes);
    popularSelect(selectPerfil, perfis);

    // ===== FUNÇÃO PARA ATUALIZAR O CAMPO DE IDENTIFICAÇÃO =====
    function atualizarIdentificacao(tipo) {
        helperIdentificacao.innerHTML = '';
        inputIdentificacao.value = '';
        if (tipo === 'Servidor' || tipo === 'Residente') {
            labelIdentificacao.textContent = 'Registro / Vínculo *';
            inputIdentificacao.placeholder = 'Digite o registro ou vínculo';
            helperIdentificacao.innerHTML = '';
        } else if (tipo === 'Estagiario') {
            labelIdentificacao.textContent = 'RG *';
            inputIdentificacao.placeholder = 'Digite o RG';
            helperIdentificacao.innerHTML = '<span class="icone-aviso">⚠️</span> Apenas para consultas, sem alterações.';
        } else if (tipo === 'Terceirizado') {
            labelIdentificacao.textContent = 'RG *';
            inputIdentificacao.placeholder = 'Digite o RG';
            helperIdentificacao.innerHTML = '';
        }
    }

    radios.forEach(radio => {
        radio.addEventListener('change', function() {
            if (this.checked) atualizarIdentificacao(this.value);
        });
    });

    const inicial = document.querySelector('input[name="tipo"]:checked');
    if (inicial) atualizarIdentificacao(inicial.value);

    // ===== COMPONENTE DE SELEÇÃO MÚLTIPLA (PADRÃO) =====
    let tagsPadrao = [];
    function renderizarTagsPadrao() {
        tagsContainerPadrao.innerHTML = '';
        if (tagsPadrao.length === 0) {
            tagsContainerPadrao.innerHTML = '<span class="vazio">Nenhum padrão selecionado</span>';
            hiddenPadroes.value = '';
            return;
        }
        tagsPadrao.forEach(tag => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.innerHTML = `${tag} <span class="remove" data-value="${tag}">×</span>`;
            tagsContainerPadrao.appendChild(span);
        });
        hiddenPadroes.value = tagsPadrao.join(', ');
        document.querySelectorAll('#tagsContainerPadrao .tag .remove').forEach(el => {
            el.addEventListener('click', function() {
                const valor = this.getAttribute('data-value');
                tagsPadrao = tagsPadrao.filter(t => t !== valor);
                renderizarTagsPadrao();
                const option = selectPadrao.querySelector(`option[value="${valor}"]`);
                if (option) option.disabled = false;
            });
        });
    }

    btnAdicionarPadrao.addEventListener('click', function() {
        const valor = selectPadrao.value;
        if (!valor) { alert('Selecione um padrão para adicionar.'); return; }
        if (tagsPadrao.includes(valor)) { alert('Este padrão já foi adicionado.'); return; }
        tagsPadrao.push(valor);
        renderizarTagsPadrao();
        const option = selectPadrao.querySelector(`option[value="${valor}"]`);
        if (option) option.disabled = true;
        selectPadrao.value = '';
    });

    // ===== COMPONENTE DE SELEÇÃO MÚLTIPLA (PERFIL) =====
    let tagsPerfil = [];
    function renderizarTagsPerfil() {
        tagsContainerPerfil.innerHTML = '';
        if (tagsPerfil.length === 0) {
            tagsContainerPerfil.innerHTML = '<span class="vazio">Nenhum perfil selecionado</span>';
            hiddenPerfis.value = '';
            return;
        }
        tagsPerfil.forEach(tag => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.innerHTML = `${tag} <span class="remove" data-value="${tag}">×</span>`;
            tagsContainerPerfil.appendChild(span);
        });
        hiddenPerfis.value = tagsPerfil.join(', ');
        document.querySelectorAll('#tagsContainerPerfil .tag .remove').forEach(el => {
            el.addEventListener('click', function() {
                const valor = this.getAttribute('data-value');
                tagsPerfil = tagsPerfil.filter(t => t !== valor);
                renderizarTagsPerfil();
                const option = selectPerfil.querySelector(`option[value="${valor}"]`);
                if (option) option.disabled = false;
            });
        });
    }

    btnAdicionarPerfil.addEventListener('click', function() {
        const valor = selectPerfil.value;
        if (!valor) { alert('Selecione um perfil para adicionar.'); return; }
        if (tagsPerfil.includes(valor)) { alert('Este perfil já foi adicionado.'); return; }
        tagsPerfil.push(valor);
        renderizarTagsPerfil();
        const option = selectPerfil.querySelector(`option[value="${valor}"]`);
        if (option) option.disabled = true;
        selectPerfil.value = '';
    });

    // ===== MODAL =====
    const modalOverlay = document.getElementById('modalSucesso');
    const modalMensagem = document.getElementById('modalMensagem');
    const btnModalOk = document.getElementById('btnModalOk');

    function exibirModal(mensagem) {
        modalMensagem.textContent = mensagem;
        modalOverlay.classList.add('active');
    }

    function fecharModalERedirecionar() {
        modalOverlay.classList.remove('active');
        window.location.href = '../dashboard.html';
    }

    btnModalOk.addEventListener('click', fecharModalERedirecionar);

    // Fechar modal ao clicar no overlay (fora da caixa)
    modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) {
            fecharModalERedirecionar();
        }
    });

    // ===== EVENTO DE ENVIO =====
    document.getElementById('btnEnviar').addEventListener('click', function(e) {
        e.preventDefault();

        const tipo = document.querySelector('input[name="tipo"]:checked').value;
        const nome = document.getElementById('nome').value.trim();
        const identificacao = document.getElementById('identificacao').value.trim();
        const justUsuario = document.getElementById('justificativaUsuario').value.trim();
        const justPadrao = document.getElementById('justificativaPadrao').value.trim();
        const justPerfil = document.getElementById('justificativaPerfil').value.trim();

        if (!nome) { alert('Preencha o Nome Completo.'); return; }
        if (!identificacao) { alert('Preencha o campo de identificação.'); return; }
        if (tagsPadrao.length === 0) { alert('Adicione pelo menos um Padrão de Acesso.'); return; }
        if (tagsPerfil.length === 0) { alert('Adicione pelo menos um Perfil de Setor.'); return; }
        if (!justUsuario) { alert('Preencha a Justificativa para Dados do Usuário.'); return; }
        if (!justPadrao) { alert('Preencha a Justificativa para Padrão de Acesso.'); return; }
        if (!justPerfil) { alert('Preencha a Justificativa para Perfil de Setor.'); return; }

        // Monta a mensagem
        const mensagem = `Chamado de inclusão de usuário enviado com sucesso!

Tipo: ${tipo}
Nome: ${nome}
Identificação: ${identificacao}

Padrões: ${tagsPadrao.join(', ')}
Perfis: ${tagsPerfil.join(', ')}

Justificativa Dados: ${justUsuario}
Justificativa Padrão: ${justPadrao}
Justificativa Perfil: ${justPerfil}`;

        // Exibe o modal em vez do alert
        exibirModal(mensagem);
    });
</script>

</body>
</html>
