<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inclusão de Novo Usuário - GLPI SIGPEC</title>
    <style>
        /* ===== RESET E BASE ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #F5F7FB;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== MENU LATERAL FIXO (USUÁRIO - SIMPLIFICADO) ===== */
        .menu-lateral {
            position: fixed;
            top: 0;
            left: 0;
            width: 162px;
            height: 100vh;
            background: #1A397A;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            padding: 34px 10px;
            box-shadow: 2px 0 12px rgba(0,0,0,0.15);
            overflow-y: auto;
        }
        .menu-lateral .menu-requisicoes {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .menu-lateral .menu-item {
            color: #FFFFFF;
            font-size: 14px;
            cursor: pointer;
            padding: 6px 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            border-radius: 4px;
            transition: 0.15s;
        }
        .menu-lateral .menu-item:hover {
            background: rgba(255,255,255,0.1);
        }
        .menu-lateral .menu-item.ativo {
            font-weight: 600;
            background: rgba(255,255,255,0.15);
        }
        .menu-lateral .menu-item .menu-icone {
            width: 20px;
            height: 20px;
            fill: #FFFFFF;
            flex-shrink: 0;
        }

        /* ===== CONTEÚDO ===== */
        .conteudo {
            margin-left: 162px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 20px 20px 20px;
            overflow-y: auto;
            height: 100vh;
            background: linear-gradient(145deg, #e8ecf1 0%, #d5dce6 100%);
        }
        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #FFFFFF;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .cabecalho .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #000;
        }
        .cabecalho .breadcrumb .home-icon { width: 18px; height: 18px; fill: #1A397A; }
        .cabecalho .usuario-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #000;
            cursor: pointer;
        }

        /* ===== FORMULÁRIO ===== */
        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            flex: 1;
        }
        .form-card {
            background: #FFFFFF;
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 600px;
            border-radius: 4px;
            overflow: hidden;
        }
        .form-card .titulo {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 24px 8px 24px;
            font-size: 26px;
            font-weight: 600;
            color: #000;
        }
        .form-card .titulo svg {
            width: 40px;
            height: 40px;
            fill: #1C1B1F;
        }
        .form-card .dados-chamado {
            background: #F5F7FC;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 8px 24px;
            font-size: 16px;
            color: #3B73A7;
            font-weight: 400;
        }
        .form-card .campo {
            padding: 12px 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-card .campo label {
            font-weight: 600;
            font-size: 13px;
            color: #000;
        }
        .form-card .campo label .obrigatorio {
            color: #d32f2f;
            margin-left: 2px;
        }
        .form-card .campo input,
        .form-card .campo select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #D9DBDE;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            background: #FFFFFF;
        }
        .form-card .campo .helper {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }
        .form-card .campo .helper .icone-aviso {
            color: #f57c00;
        }
        .form-card .campo-radio {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 4px 0;
        }
        .form-card .campo-radio label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 400;
            font-size: 13px;
            color: #000;
            cursor: pointer;
        }
        .form-card .campo-radio input[type="radio"] {
            width: 16px;
            height: 16px;
            accent-color: #5B5083;
            cursor: pointer;
        }
        .form-card .acoes {
            padding: 16px 24px;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #eee;
        }
        .btn-enviar {
            background: #FFFFFF;
            border: 1px solid #D9D9D9;
            border-radius: 4px;
            padding: 8px 24px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: #000;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-enviar:hover {
            background: #f0f0f0;
        }
        .campo-identificacao {
            transition: all 0.2s;
        }

        /* ===== COMPONENTE DE SELEÇÃO MÚLTIPLA (TAGS) ===== */
        .multiselect-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .multiselect-control {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .multiselect-control select {
            flex: 1;
            height: 36px;
            padding: 4px 8px;
            border: 1px solid #D9DBDE;
            border-radius: 4px;
            font-size: 13px;
            background: #FFFFFF;
        }
        .multiselect-control button {
            height: 36px;
            padding: 0 16px;
            background: #5B5083;
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .multiselect-control button:hover {
            background: #4a3f6e;
        }
        .multiselect-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 6px 8px;
            min-height: 36px;
            border: 1px solid #D9DBDE;
            border-radius: 4px;
            background: #FAFBFC;
        }
        .multiselect-tags .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #E7E7E7;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            color: #000;
        }
        .multiselect-tags .tag .remove {
            cursor: pointer;
            font-weight: bold;
            color: #999;
            font-size: 14px;
            line-height: 1;
        }
        .multiselect-tags .tag .remove:hover {
            color: #d32f2f;
        }
        .multiselect-tags .vazio {
            color: #999;
            font-size: 13px;
        }

        /* ===== MODAL PERSONALIZADO ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(3px);
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 40px 35px 30px;
            max-width: 580px;
            width: 92%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeInUp 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-content .icone-sucesso {
            font-size: 56px;
            margin-bottom: 12px;
            display: block;
        }
        .modal-content h2 {
            font-size: 26px;
            font-weight: 700;
            color: #1A397A;
            margin-bottom: 12px;
        }
        .modal-content .mensagem-modal {
            background: #F5F7FC;
            border-radius: 8px;
            padding: 18px 20px;
            text-align: left;
            font-size: 14px;
            line-height: 1.7;
            color: #222;
            margin: 16px 0 24px;
            border-left: 4px solid #5B5083;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Inter', sans-serif;
        }
        .modal-content .btn-modal {
            background: #1A397A;
            color: #FFFFFF;
            border: none;
            padding: 12px 48px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: 'Inter', sans-serif;
        }
        .modal-content .btn-modal:hover {
            background: #0e295e;
        }
        .modal-content .btn-modal:active {
            transform: scale(0.97);
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {
            .menu-lateral { width: 60px; padding: 20px 10px; }
            .menu-lateral .menu-item span { display: none; }
            .conteudo { margin-left: 60px; padding: 12px; }
            .cabecalho .breadcrumb span { font-size: 12px; }
            .form-card .titulo { font-size: 20px; }
        }
        @media (max-width: 480px) {
            .menu-lateral { width: 50px; padding: 10px 6px; }
            .menu-lateral .menu-item { padding: 4px 4px; }
            .conteudo { margin-left: 50px; padding: 8px; }
            .form-card .titulo { font-size: 18px; padding: 12px 16px; }
            .form-card .campo { padding: 8px 16px; }
            .modal-content { padding: 28px 18px; }
            .modal-content h2 { font-size: 22px; }
            .modal-content .btn-modal { padding: 10px 32px; font-size: 16px; }
        }
    </style>
</head>
<body>

<!-- ===== MENU LATERAL FIXO (SIMPLIFICADO) ===== -->
<div class="menu-lateral">
    <div class="menu-requisicoes">
        <!-- Serviços -->
        <a href="../dashboard.html" class="menu-item">
            <svg class="menu-icone" viewBox="0 0 24 24"><path d="M12 1C7.58 1 4 4.58 4 9v3c0 4.42 3.58 8 8 8s8-3.58 8-8v-3c0-4.42-3.58-8-8-8zm0 2c3.31 0 6 2.69 6 6v3c0 3.31-2.69 6-6 6s-6-2.69-6-6v-3c0-3.31 2.69-6 6-6z"/></svg>
            <span>Serviços</span>
        </a>
        <!-- Meus Chamados -->
        <a href="../meus-chamados.html" class="menu-item">
            <svg class="menu-icone" viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
            <span>Meus Chamados</span>
        </a>
    </div>
</div>

<!-- ===== CONTEÚDO ===== -->
<div class="conteudo">

    <!-- Cabeçalho -->
    <div class="cabecalho">
        <div class="breadcrumb">
            <svg class="home-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home /</span>
            <span style="color:#000;">Serviços / Inclusão de Novo Usuário</span>
        </div>
        <div class="usuario-dropdown">
            <span>Usuário</span>
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
    </div>

    <!-- Formulário -->
    <div class="form-container">
        <div class="form-card">
            <!-- Título -->
            <div class="titulo">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Inclusão de Novo Usuário
            </div>
            <div class="dados-chamado">Dados do Chamado</div>

            <!-- Tipo de Usuário -->
            <div class="campo">
                <label>Tipo de Usuário <span class="obrigatorio">*</span></label>
                <div class="campo-radio" id="tipoUsuario">
                    <label><input type="radio" name="tipo" value="Servidor" checked /> Servidor</label>
                    <label><input type="radio" name="tipo" value="Estagiario" /> Estagiário</label>
                    <label><input type="radio" name="tipo" value="Residente" /> Residente</label>
                    <label><input type="radio" name="tipo" value="Terceirizado" /> Terceirizado</label>
                </div>
            </div>

            <!-- Nome Social (Sim/Não) -->
            <div class="campo">
                <label>Possui nome social? <span class="obrigatorio">*</span></label>
                <div class="campo-radio" id="nomeSocialOpcao">
                    <label><input type="radio" name="nomeSocial" value="sim" /> Sim</label>
                    <label><input type="radio" name="nomeSocial" value="nao" checked /> Não</label>
                </div>
            </div>

            <!-- Campo Nome Social (condicional) -->
            <div class="campo" id="campoNomeSocial" style="display:none;">
                <label for="nomeSocialInput">Nome Social <span class="obrigatorio">*</span></label>
                <input type="text" id="nomeSocialInput" placeholder="Digite o nome social" />
            </div>

            <!-- Nome Completo -->
            <div class="campo">
                <label for="nome">Nome Completo <span class="obrigatorio">*</span></label>
                <input type="text" id="nome" placeholder="Digite o nome completo" />
            </div>

            <!-- Registro Funcional -->
            <div class="campo campo-identificacao" id="campoIdentificacao">
                <label for="identificacao" id="labelIdentificacao">Registro Funcional <span class="obrigatorio">*</span></label>
                <input type="text" id="identificacao" placeholder="Digite o registro funcional" />
                <div class="helper" id="helperIdentificacao"></div>
            </div>

            <!-- Justificativa para Dados do Usuário (select com opções) -->
            <div class="campo">
                <label for="justificativaUsuario">Justificativa para o acesso do Usuário<span class="obrigatorio">*</span></label>
                <select id="justificativaUsuario">
                    <option value="">Selecione...</option>
                    <option value="Atua na URH">Atua na URH</option>
                    <option value="Cadastro de cursos">Cadastro de cursos</option>
                    <option value="Cadastro funcionais">Cadastro funcionais</option>
                    <option value="Consultas gerais">Consultas gerais</option>
                    <option value="Recuperação de prontuário (REC)">Recuperação de prontuário (REC)</option>
                    <option value="Outro">Outro</option>
                </select>
                <div id="outroJustificativaUsuario" style="display:none; margin-top:4px;">
                    <input type="text" id="outroJustificativaUsuarioInput" placeholder="Descreva a justificativa..." style="width:100%; padding:8px 10px; border:1px solid #D9DBDE; border-radius:4px; font-size:13px;" />
                </div>
            </div>

            <!-- Padrão de Acesso (multiselect) -->
            <div class="campo">
                <label>Padrão de Acesso <span class="obrigatorio">*</span></label>
                <div class="multiselect-wrapper" id="multiselectContainerPadrao">
                    <div class="multiselect-control">
                        <select id="selectPadrao">
                            <option value="">Selecione um padrão</option>
                        </select>
                        <button type="button" id="btnAdicionarPadrao">Adicionar</button>
                    </div>
                    <div class="multiselect-tags" id="tagsContainerPadrao">
                        <span class="vazio">Nenhum padrão selecionado</span>
                    </div>
                </div>
                <input type="hidden" id="padroesSelecionados" value="" />
            </div>

            <!-- Justificativa para Padrão de Acesso (select com opções) -->
            <!--
            <div class="campo">
                <label for="justificativaPadrao">Justificativa para Padrão de Acesso <span class="obrigatorio">*</span></label>
                <select id="justificativaPadrao">
                    <option value="">Selecione...</option>
                    <option value="Solicitação de novo acesso">Solicitação de novo acesso</option>
                    <option value="Alteração de permissões">Alteração de permissões</option>
                    <option value="Correção de dados">Correção de dados</option>
                    <option value="Desligamento de servidor">Desligamento de servidor</option>
                    <option value="Reintegração">Reintegração</option>
                    <option value="Outro">Outro</option>
                </select>
                <div id="outroJustificativaPadrao" style="display:none; margin-top:4px;">
                    <input type="text" id="outroJustificativaPadraoInput" placeholder="Descreva a justificativa..." style="width:100%; padding:8px 10px; border:1px solid #D9DBDE; border-radius:4px; font-size:13px;" />
                </div>
            </div>-->

            <!-- Perfil de Setor (multiselect) -->
            <div class="campo">
                <label>Perfil de Setor <span class="obrigatorio">*</span></label>
                <div class="multiselect-wrapper" id="multiselectContainerPerfil">
                    <div class="multiselect-control">
                        <select id="selectPerfil">
                            <option value="">Selecione um perfil</option>
                        </select>
                        <button type="button" id="btnAdicionarPerfil">Adicionar</button>
                    </div>
                    <div class="multiselect-tags" id="tagsContainerPerfil">
                        <span class="vazio">Nenhum perfil selecionado</span>
                    </div>
                </div>
                <input type="hidden" id="perfisSelecionados" value="" />
            </div>

            <!-- Justificativa para Perfil de Setor (select com opções) -->
            <div class="campo">
                <label for="justificativaPerfil">Justificativa para Perfil de Setor <span class="obrigatorio">*</span></label>
                <select id="justificativaPerfil">
                    <option value="">Selecione...</option>
                    <option value="Setor onde o servidor atua">Solicitação de novo acesso</option>
                    <option value="Setor agregado">Setor agregado</option>
                    <option value="Acrescentar setor de acordo com a necessidade da URH">Acrescentar setor de acordo com a necessidade da URH</option>
                    <option value="Setor extinto que possui servidores">Setor extinto que possui servidores</option>
                    <option value="Outro">Outro</option>
                </select>
                <div id="outroJustificativaPerfil" style="display:none; margin-top:4px;">
                    <input type="text" id="outroJustificativaPerfilInput" placeholder="Descreva a justificativa..." style="width:100%; padding:8px 10px; border:1px solid #D9DBDE; border-radius:4px; font-size:13px;" />
                </div>
            </div>

            <!-- Botão Enviar -->
            <div class="acoes">
                <button class="btn-enviar" id="btnEnviar">Enviar</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== MODAL PERSONALIZADO ===== -->
<div class="modal-overlay" id="modalSucesso">
    <div class="modal-content">
        <span class="icone-sucesso">✅</span>
        <h2>Chamado Enviado com Sucesso!</h2>
        <div class="mensagem-modal" id="modalMensagem"></div>
        <button class="btn-modal" id="btnModalOk">OK</button>
    </div>
</div>

<script>
    // ===== LISTAS DE DADOS =====
    const padroes = [
        "BASICO", "CONSULTA_GERAL", "Ergon", "AHM_PARCELAMEN", "CADASTRO",
        "DEBITOS", "FOLHA_UNIDADES", "APOS/EXONER", "SEG HOLERITE", "AUX_FUNERAL",
        "ACESSO_WEB"
    ];

    const perfis = [
        "CMSP", "GERAL", "IPREM", "PENSIONISTA", "SFMSP", "TCMSP",
        "AHM_GERAL", "MUNICIPALIZADOS", "SMS", "IPREM_APOS", "APOS_SME",
        "SME", "AFASTADOS", "AHM-JSH", "AMLURB"
    ];

    // ===== ELEMENTOS =====
    const radios = document.querySelectorAll('input[name="tipo"]');
    const campoIdentificacao = document.getElementById('campoIdentificacao');
    const labelIdentificacao = document.getElementById('labelIdentificacao');
    const inputIdentificacao = document.getElementById('identificacao');
    const helperIdentificacao = document.getElementById('helperIdentificacao');

    // Nome Social
    const nomeSocialRadios = document.querySelectorAll('input[name="nomeSocial"]');
    const campoNomeSocial = document.getElementById('campoNomeSocial');
    const nomeSocialInput = document.getElementById('nomeSocialInput');

    // Justificativas - exibir campo "Outro"
    const justificativaUsuarioSelect = document.getElementById('justificativaUsuario');
    const outroJustificativaUsuario = document.getElementById('outroJustificativaUsuario');
    const outroJustificativaUsuarioInput = document.getElementById('outroJustificativaUsuarioInput');

    const justificativaPadraoSelect = document.getElementById('justificativaPadrao');
    const outroJustificativaPadrao = document.getElementById('outroJustificativaPadrao');
    const outroJustificativaPadraoInput = document.getElementById('outroJustificativaPadraoInput');

    const justificativaPerfilSelect = document.getElementById('justificativaPerfil');
    const outroJustificativaPerfil = document.getElementById('outroJustificativaPerfil');
    const outroJustificativaPerfilInput = document.getElementById('outroJustificativaPerfilInput');

    // Padrão
    const selectPadrao = document.getElementById('selectPadrao');
    const btnAdicionarPadrao = document.getElementById('btnAdicionarPadrao');
    const tagsContainerPadrao = document.getElementById('tagsContainerPadrao');
    const hiddenPadroes = document.getElementById('padroesSelecionados');

    // Perfil
    const selectPerfil = document.getElementById('selectPerfil');
    const btnAdicionarPerfil = document.getElementById('btnAdicionarPerfil');
    const tagsContainerPerfil = document.getElementById('tagsContainerPerfil');
    const hiddenPerfis = document.getElementById('perfisSelecionados');

    // ===== POPULAR SELECTS =====
    function popularSelect(select, opcoes) {
        select.innerHTML = '';
        const optDefault = document.createElement('option');
        optDefault.value = '';
        optDefault.textContent = 'Selecione...';
        select.appendChild(optDefault);
        opcoes.forEach(op => {
            const opt = document.createElement('option');
            opt.value = op;
            opt.textContent = op;
            select.appendChild(opt);
        });
    }

    popularSelect(selectPadrao, padroes);
    popularSelect(selectPerfil, perfis);

    // ===== FUNÇÃO PARA ATUALIZAR O CAMPO DE IDENTIFICAÇÃO =====
    function atualizarIdentificacao(tipo) {
        helperIdentificacao.innerHTML = '';
        inputIdentificacao.value = '';
        if (tipo === 'Servidor' || tipo === 'Residente') {
            labelIdentificacao.textContent = 'Registro Funcional *';
            inputIdentificacao.placeholder = 'Digite o registro funcional';
            helperIdentificacao.innerHTML = '';
        } else if (tipo === 'Estagiario') {
            labelIdentificacao.textContent = 'RG *';
            inputIdentificacao.placeholder = 'Digite o RG';
            helperIdentificacao.innerHTML = '<span class="icone-aviso">⚠️</span> Apenas para consultas, sem alterações.';
        } else if (tipo === 'Terceirizado') {
            labelIdentificacao.textContent = 'RG *';
            inputIdentificacao.placeholder = 'Digite o RG';
            helperIdentificacao.innerHTML = '';
        }
    }

    // ===== EVENTO PARA RADIOS (Tipo de Usuário) =====
    radios.forEach(radio => {
        radio.addEventListener('change', function() {
            if (this.checked) {
                atualizarIdentificacao(this.value);
            }
        });
    });

    // Inicializa com o valor padrão (Servidor)
    const inicial = document.querySelector('input[name="tipo"]:checked');
    if (inicial) atualizarIdentificacao(inicial.value);

    // ===== NOME SOCIAL =====
    nomeSocialRadios.forEach(radio => {
        radio.addEventListener('change', function() {
            if (this.value === 'sim') {
                campoNomeSocial.style.display = 'block';
                nomeSocialInput.setAttribute('required', 'required');
            } else {
                campoNomeSocial.style.display = 'none';
                nomeSocialInput.removeAttribute('required');
                nomeSocialInput.value = '';
            }
        });
    });

    // ===== JUSTIFICATIVAS - EXIBIR CAMPO "OUTRO" =====
    function toggleOutroJustificativa(select, container, input) {
        if (select.value === 'Outro') {
            container.style.display = 'block';
            input.setAttribute('required', 'required');
        } else {
            container.style.display = 'none';
            input.removeAttribute('required');
            input.value = '';
        }
    }

    justificativaUsuarioSelect.addEventListener('change', function() {
        toggleOutroJustificativa(this, outroJustificativaUsuario, outroJustificativaUsuarioInput);
    });
    justificativaPadraoSelect.addEventListener('change', function() {
        toggleOutroJustificativa(this, outroJustificativaPadrao, outroJustificativaPadraoInput);
    });
    justificativaPerfilSelect.addEventListener('change', function() {
        toggleOutroJustificativa(this, outroJustificativaPerfil, outroJustificativaPerfilInput);
    });

    // ===== COMPONENTE DE SELEÇÃO MÚLTIPLA (PADRÃO) =====
    let tagsPadrao = [];

    function renderizarTagsPadrao() {
        tagsContainerPadrao.innerHTML = '';
        if (tagsPadrao.length === 0) {
            tagsContainerPadrao.innerHTML = '<span class="vazio">Nenhum padrão selecionado</span>';
            hiddenPadroes.value = '';
            return;
        }
        tagsPadrao.forEach(tag => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.innerHTML = `${tag} <span class="remove" data-value="${tag}">×</span>`;
            tagsContainerPadrao.appendChild(span);
        });
        hiddenPadroes.value = tagsPadrao.join(', ');

        document.querySelectorAll('#tagsContainerPadrao .tag .remove').forEach(el => {
            el.addEventListener('click', function() {
                const valor = this.getAttribute('data-value');
                tagsPadrao = tagsPadrao.filter(t => t !== valor);
                renderizarTagsPadrao();
                const option = selectPadrao.querySelector(`option[value="${valor}"]`);
                if (option) option.disabled = false;
            });
        });
    }

    btnAdicionarPadrao.addEventListener('click', function() {
        const valor = selectPadrao.value;
        if (!valor) {
            alert('Selecione um padrão para adicionar.');
            return;
        }
        if (tagsPadrao.includes(valor)) {
            alert('Este padrão já foi adicionado.');
            return;
        }
        tagsPadrao.push(valor);
        renderizarTagsPadrao();
        const option = selectPadrao.querySelector(`option[value="${valor}"]`);
        if (option) option.disabled = true;
        selectPadrao.value = '';
    });

    // ===== COMPONENTE DE SELEÇÃO MÚLTIPLA (PERFIL) =====
    let tagsPerfil = [];

    function renderizarTagsPerfil() {
        tagsContainerPerfil.innerHTML = '';
        if (tagsPerfil.length === 0) {
            tagsContainerPerfil.innerHTML = '<span class="vazio">Nenhum perfil selecionado</span>';
            hiddenPerfis.value = '';
            return;
        }
        tagsPerfil.forEach(tag => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.innerHTML = `${tag} <span class="remove" data-value="${tag}">×</span>`;
            tagsContainerPerfil.appendChild(span);
        });
        hiddenPerfis.value = tagsPerfil.join(', ');

        document.querySelectorAll('#tagsContainerPerfil .tag .remove').forEach(el => {
            el.addEventListener('click', function() {
                const valor = this.getAttribute('data-value');
                tagsPerfil = tagsPerfil.filter(t => t !== valor);
                renderizarTagsPerfil();
                const option = selectPerfil.querySelector(`option[value="${valor}"]`);
                if (option) option.disabled = false;
            });
        });
    }

    btnAdicionarPerfil.addEventListener('click', function() {
        const valor = selectPerfil.value;
        if (!valor) {
            alert('Selecione um perfil para adicionar.');
            return;
        }
        if (tagsPerfil.includes(valor)) {
            alert('Este perfil já foi adicionado.');
            return;
        }
        tagsPerfil.push(valor);
        renderizarTagsPerfil();
        const option = selectPerfil.querySelector(`option[value="${valor}"]`);
        if (option) option.disabled = true;
        selectPerfil.value = '';
    });

    // ===== MODAL =====
    const modalOverlay = document.getElementById('modalSucesso');
    const modalMensagem = document.getElementById('modalMensagem');
    const btnModalOk = document.getElementById('btnModalOk');

    function exibirModal(mensagem) {
        modalMensagem.textContent = mensagem;
        modalOverlay.classList.add('active');
    }

    function fecharModalERedirecionar() {
        modalOverlay.classList.remove('active');
        window.location.href = '../dashboard.html';
    }

    btnModalOk.addEventListener('click', fecharModalERedirecionar);

    modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) {
            fecharModalERedirecionar();
        }
    });

    // ===== EVENTO DE ENVIO =====
    document.getElementById('btnEnviar').addEventListener('click', function(e) {
        e.preventDefault();

        const tipo = document.querySelector('input[name="tipo"]:checked').value;
        const nomeSocial = document.querySelector('input[name="nomeSocial"]:checked').value;
        const nome = document.getElementById('nome').value.trim();
        const identificacao = document.getElementById('identificacao').value.trim();

        let justUsuario = justificativaUsuarioSelect.value;
        if (justUsuario === 'Outro') {
            justUsuario = outroJustificativaUsuarioInput.value.trim();
        }
        let justPadrao = justificativaPadraoSelect.value;
        if (justPadrao === 'Outro') {
            justPadrao = outroJustificativaPadraoInput.value.trim();
        }
        let justPerfil = justificativaPerfilSelect.value;
        if (justPerfil === 'Outro') {
            justPerfil = outroJustificativaPerfilInput.value.trim();
        }

        if (!nome) {
            alert('Preencha o Nome Completo.');
            return;
        }
        if (nomeSocial === 'sim' && !document.getElementById('nomeSocialInput').value.trim()) {
            alert('Preencha o Nome Social.');
            return;
        }
        if (!identificacao) {
            alert('Preencha o campo de identificação.');
            return;
        }
        if (tagsPadrao.length === 0) {
            alert('Adicione pelo menos um Padrão de Acesso.');
            return;
        }
        if (tagsPerfil.length === 0) {
            alert('Adicione pelo menos um Perfil de Setor.');
            return;
        }
        if (!justUsuario) {
            alert('Preencha a Justificativa para Dados do Usuário.');
            return;
        }
        if (!justPadrao) {
            alert('Preencha a Justificativa para Padrão de Acesso.');
            return;
        }
        if (!justPerfil) {
            alert('Preencha a Justificativa para Perfil de Setor.');
            return;
        }

        const mensagem = `Chamado de inclusão de usuário enviado com sucesso!

Tipo: ${tipo}
Nome Social: ${nomeSocial === 'sim' ? document.getElementById('nomeSocialInput').value.trim() : 'Não informado'}
Nome: ${nome}
${labelIdentificacao.textContent.replace(' *', '')}: ${identificacao}

Padrões: ${tagsPadrao.join(', ')}
Perfis: ${tagsPerfil.join(', ')}

Justificativa Dados: ${justUsuario}
Justificativa Padrão: ${justPadrao}
Justificativa Perfil: ${justPerfil}`;

        exibirModal(mensagem);
    });
</script>

</body>
</html>
