<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inclusão de Setor - GLPI SIGPEC</title>
    <style>
        /* ===== RESET E BASE ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #F5F7FB;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== MENU LATERAL FIXO (USUÁRIO - SIMPLIFICADO) ===== */
        .menu-lateral {
            position: fixed;
            top: 0;
            left: 0;
            width: 162px;
            height: 100vh;
            background: #1A397A;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            padding: 34px 10px;
            box-shadow: 2px 0 12px rgba(0,0,0,0.15);
            overflow-y: auto;
        }
        .menu-lateral .menu-requisicoes {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .menu-lateral .menu-item {
            color: #FFFFFF;
            font-size: 14px;
            cursor: pointer;
            padding: 6px 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            border-radius: 4px;
            transition: 0.15s;
        }
        .menu-lateral .menu-item:hover {
            background: rgba(255,255,255,0.1);
        }
        .menu-lateral .menu-item.ativo {
            font-weight: 600;
            background: rgba(255,255,255,0.15);
        }
        .menu-lateral .menu-item .menu-icone {
            width: 20px;
            height: 20px;
            fill: #FFFFFF;
            flex-shrink: 0;
        }

        /* ===== CONTEÚDO ===== */
        .conteudo {
            margin-left: 162px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 20px 20px 20px;
            overflow-y: auto;
            height: 100vh;
            background: linear-gradient(145deg, #e8ecf1 0%, #d5dce6 100%);
        }
        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #FFFFFF;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .cabecalho .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #000;
        }
        .cabecalho .breadcrumb .home-icon { width: 18px; height: 18px; fill: #1A397A; }
        .cabecalho .usuario-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #000;
            cursor: pointer;
        }

        /* ===== FORMULÁRIO ===== */
        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            flex: 1;
        }
        .form-card {
            background: #FFFFFF;
            box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 600px;
            border-radius: 4px;
            overflow: hidden;
        }
        .form-card .titulo {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 24px 8px 24px;
            font-size: 26px;
            font-weight: 600;
            color: #000;
        }
        .form-card .titulo svg {
            width: 40px;
            height: 40px;
            fill: #1C1B1F;
        }
        .form-card .dados-chamado {
            background: #F5F7FC;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 8px 24px;
            font-size: 16px;
            color: #3B73A7;
            font-weight: 400;
        }
        .form-card .campo {
            padding: 12px 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-card .campo label {
            font-weight: 600;
            font-size: 13px;
            color: #000;
        }
        .form-card .campo label .obrigatorio {
            color: #d32f2f;
            margin-left: 2px;
        }
        .form-card .campo input,
        .form-card .campo select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #D9DBDE;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            background: #FFFFFF;
        }
        .form-card .campo .helper {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }
        .form-card .campo .helper .icone-aviso {
            color: #f57c00;
        }
        .form-card .acoes {
            padding: 16px 24px;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #eee;
        }
        .btn-enviar {
            background: #FFFFFF;
            border: 1px solid #D9D9D9;
            border-radius: 4px;
            padding: 8px 24px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: #000;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-enviar:hover {
            background: #f0f0f0;
        }

        /* ===== COMPONENTE DE SELEÇÃO MÚLTIPLA (TAGS) ===== */
        .multiselect-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .multiselect-control {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .multiselect-control select {
            flex: 1;
            height: 36px;
            padding: 4px 8px;
            border: 1px solid #D9DBDE;
            border-radius: 4px;
            font-size: 13px;
            background: #FFFFFF;
        }
        .multiselect-control button {
            height: 36px;
            padding: 0 16px;
            background: #5B5083;
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .multiselect-control button:hover {
            background: #4a3f6e;
        }
        .multiselect-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 6px 8px;
            min-height: 36px;
            border: 1px solid #D9DBDE;
            border-radius: 4px;
            background: #FAFBFC;
        }
        .multiselect-tags .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #E7E7E7;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            color: #000;
        }
        .multiselect-tags .tag .remove {
            cursor: pointer;
            font-weight: bold;
            color: #999;
            font-size: 14px;
            line-height: 1;
        }
        .multiselect-tags .tag .remove:hover {
            color: #d32f2f;
        }
        .multiselect-tags .vazio {
            color: #999;
            font-size: 13px;
        }

        /* ===== MODAL PERSONALIZADO ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(3px);
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 40px 35px 30px;
            max-width: 580px;
            width: 92%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeInUp 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-content .icone-sucesso {
            font-size: 56px;
            margin-bottom: 12px;
            display: block;
        }
        .modal-content h2 {
            font-size: 26px;
            font-weight: 700;
            color: #1A397A;
            margin-bottom: 12px;
        }
        .modal-content .mensagem-modal {
            background: #F5F7FC;
            border-radius: 8px;
            padding: 18px 20px;
            text-align: left;
            font-size: 14px;
            line-height: 1.7;
            color: #222;
            margin: 16px 0 24px;
            border-left: 4px solid #5B5083;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Inter', sans-serif;
        }
        .modal-content .btn-modal {
            background: #1A397A;
            color: #FFFFFF;
            border: none;
            padding: 12px 48px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: 'Inter', sans-serif;
        }
        .modal-content .btn-modal:hover {
            background: #0e295e;
        }
        .modal-content .btn-modal:active {
            transform: scale(0.97);
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {
            .menu-lateral { width: 60px; padding: 20px 10px; }
            .menu-lateral .menu-item span { display: none; }
            .conteudo { margin-left: 60px; padding: 12px; }
            .cabecalho .breadcrumb span { font-size: 12px; }
            .form-card .titulo { font-size: 20px; }
        }
        @media (max-width: 480px) {
            .menu-lateral { width: 50px; padding: 10px 6px; }
            .menu-lateral .menu-item { padding: 4px 4px; }
            .conteudo { margin-left: 50px; padding: 8px; }
            .form-card .titulo { font-size: 18px; padding: 12px 16px; }
            .form-card .campo { padding: 8px 16px; }
            .modal-content { padding: 28px 18px; }
            .modal-content h2 { font-size: 22px; }
            .modal-content .btn-modal { padding: 10px 32px; font-size: 16px; }
        }
    </style>
</head>
<body>

<!-- ===== MENU LATERAL FIXO (SIMPLIFICADO) ===== -->
<div class="menu-lateral">
    <div class="menu-requisicoes">
        <!-- Serviços -->
        <a href="../dashboard.html" class="menu-item">
            <svg class="menu-icone" viewBox="0 0 24 24"><path d="M12 1C7.58 1 4 4.58 4 9v3c0 4.42 3.58 8 8 8s8-3.58 8-8v-3c0-4.42-3.58-8-8-8zm0 2c3.31 0 6 2.69 6 6v3c0 3.31-2.69 6-6 6s-6-2.69-6-6v-3c0-3.31 2.69-6 6-6z"/></svg>
            <span>Serviços</span>
        </a>
        <!-- Meus Chamados -->
        <a href="../meus-chamados.html" class="menu-item">
            <svg class="menu-icone" viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
            <span>Meus Chamados</span>
        </a>
    </div>
</div>

<!-- ===== CONTEÚDO ===== -->
<div class="conteudo">

    <!-- Cabeçalho -->
    <div class="cabecalho">
        <div class="breadcrumb">
            <svg class="home-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home /</span>
            <span style="color:#000;">Serviços / Inclusão de Setor</span>
        </div>
        <div class="usuario-dropdown">
            <span>Usuário</span>
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
    </div>

    <!-- Formulário -->
    <div class="form-container">
        <div class="form-card">
            <!-- Título -->
            <div class="titulo">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                Inclusão de Setor
            </div>
            <div class="dados-chamado">Dados do Chamado</div>

            <!-- Nome de Usuário -->
            <div class="campo">
                <label for="nomeUsuario">Nome de Usuário <span class="obrigatorio">*</span></label>
                <input type="text" id="nomeUsuario" placeholder="Digite o nome do usuário" />
            </div>

            <!-- Login de Usuário -->
            <div class="campo">
                <label for="loginUsuario">Login de Usuário <span class="obrigatorio">*</span></label>
                <input type="text" id="loginUsuario" placeholder="Digite o login do usuário" />
            </div>

            <!-- Perfil de Setor (multiselect com tags) -->
            <div class="campo">
                <label>Perfil de Setor <span class="obrigatorio">*</span></label>
                <div class="multiselect-wrapper" id="multiselectContainerPerfil">
                    <div class="multiselect-control">
                        <select id="selectPerfil">
                            <option value="">Selecione um perfil</option>
                        </select>
                        <button type="button" id="btnAdicionarPerfil">Adicionar</button>
                    </div>
                    <div class="multiselect-tags" id="tagsContainerPerfil">
                        <span class="vazio">Nenhum perfil selecionado</span>
                    </div>
                </div>
                <input type="hidden" id="perfisSelecionados" value="" />
            </div>

            <!-- Justificativa (select com opções) -->
            <div class="campo">
                <label for="justificativa">Justificativa <span class="obrigatorio">*</span></label>
                <select id="justificativa">
                    <option value="">Selecione...</option>
                    <option value="Solicitação de novo acesso">Solicitação de novo acesso</option>
                    <option value="Alteração de permissões">Alteração de permissões</option>
                    <option value="Correção de dados">Correção de dados</option>
                    <option value="Desligamento de servidor">Desligamento de servidor</option>
                    <option value="Reintegração">Reintegração</option>
                    <option value="Outro">Outro</option>
                </select>
                <div id="outroJustificativa" style="display:none; margin-top:4px;">
                    <input type="text" id="outroJustificativaInput" placeholder="Descreva a justificativa..." style="width:100%; padding:8px 10px; border:1px solid #D9DBDE; border-radius:4px; font-size:13px;" />
                </div>
            </div>

            <!-- Botão Enviar -->
            <div class="acoes">
                <button class="btn-enviar" id="btnEnviar">Enviar</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== MODAL PERSONALIZADO ===== -->
<div class="modal-overlay" id="modalSucesso">
    <div class="modal-content">
        <span class="icone-sucesso">✅</span>
        <h2>Chamado Enviado com Sucesso!</h2>
        <div class="mensagem-modal" id="modalMensagem"></div>
        <button class="btn-modal" id="btnModalOk">OK</button>
    </div>
</div>

<script>
    // ===== LISTA DE PERFIS DE SETOR =====
    const perfis = [
        "CMSP", "GERAL", "IPREM", "PENSIONISTA", "SFMSP", "TCMSP",
        "AHM_GERAL", "MUNICIPALIZADOS", "SMS", "IPREM_APOS", "APOS_SME",
        "SME", "AFASTADOS", "AHM-JSH", "AMLURB"
    ];

    // ===== ELEMENTOS =====
    const selectPerfil = document.getElementById('selectPerfil');
    const btnAdicionarPerfil = document.getElementById('btnAdicionarPerfil');
    const tagsContainerPerfil = document.getElementById('tagsContainerPerfil');
    const hiddenPerfis = document.getElementById('perfisSelecionados');

    // Justificativa
    const justificativaSelect = document.getElementById('justificativa');
    const outroJustificativa = document.getElementById('outroJustificativa');
    const outroJustificativaInput = document.getElementById('outroJustificativaInput');

    // ===== POPULAR SELECT =====
    function popularSelect(select, opcoes) {
        select.innerHTML = '';
        const optDefault = document.createElement('option');
        optDefault.value = '';
        optDefault.textContent = 'Selecione...';
        select.appendChild(optDefault);
        opcoes.forEach(op => {
            const opt = document.createElement('option');
            opt.value = op;
            opt.textContent = op;
            select.appendChild(opt);
        });
    }

    popularSelect(selectPerfil, perfis);

    // ===== COMPONENTE DE SELEÇÃO MÚLTIPLA =====
    let tagsPerfil = [];

    function renderizarTags() {
        tagsContainerPerfil.innerHTML = '';
        if (tagsPerfil.length === 0) {
            tagsContainerPerfil.innerHTML = '<span class="vazio">Nenhum perfil selecionado</span>';
            hiddenPerfis.value = '';
            return;
        }
        tagsPerfil.forEach(tag => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.innerHTML = `${tag} <span class="remove" data-value="${tag}">×</span>`;
            tagsContainerPerfil.appendChild(span);
        });
        hiddenPerfis.value = tagsPerfil.join(', ');

        document.querySelectorAll('#tagsContainerPerfil .tag .remove').forEach(el => {
            el.addEventListener('click', function() {
                const valor = this.getAttribute('data-value');
                tagsPerfil = tagsPerfil.filter(t => t !== valor);
                renderizarTags();
                const option = selectPerfil.querySelector(`option[value="${valor}"]`);
                if (option) option.disabled = false;
            });
        });
    }

    btnAdicionarPerfil.addEventListener('click', function() {
        const valor = selectPerfil.value;
        if (!valor) {
            alert('Selecione um perfil para adicionar.');
            return;
        }
        if (tagsPerfil.includes(valor)) {
            alert('Este perfil já foi adicionado.');
            return;
        }
        tagsPerfil.push(valor);
        renderizarTags();
        const option = selectPerfil.querySelector(`option[value="${valor}"]`);
        if (option) option.disabled = true;
        selectPerfil.value = '';
    });

    // ===== JUSTIFICATIVA - EXIBIR CAMPO "OUTRO" =====
    function toggleOutroJustificativa(select, container, input) {
        if (select.value === 'Outro') {
            container.style.display = 'block';
            input.setAttribute('required', 'required');
        } else {
            container.style.display = 'none';
            input.removeAttribute('required');
            input.value = '';
        }
    }

    justificativaSelect.addEventListener('change', function() {
        toggleOutroJustificativa(this, outroJustificativa, outroJustificativaInput);
    });

    // ===== MODAL =====
    const modalOverlay = document.getElementById('modalSucesso');
    const modalMensagem = document.getElementById('modalMensagem');
    const btnModalOk = document.getElementById('btnModalOk');

    function exibirModal(mensagem) {
        modalMensagem.textContent = mensagem;
        modalOverlay.classList.add('active');
    }

    function fecharModalERedirecionar() {
        modalOverlay.classList.remove('active');
        window.location.href = '../dashboard.html';
    }

    btnModalOk.addEventListener('click', fecharModalERedirecionar);

    modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) {
            fecharModalERedirecionar();
        }
    });

    // ===== EVENTO DE ENVIO =====
    document.getElementById('btnEnviar').addEventListener('click', function(e) {
        e.preventDefault();

        const nomeUsuario = document.getElementById('nomeUsuario').value.trim();
        const loginUsuario = document.getElementById('loginUsuario').value.trim();
        let justificativa = justificativaSelect.value;

        if (justificativa === 'Outro') {
            justificativa = outroJustificativaInput.value.trim();
        }

        if (!nomeUsuario) {
            alert('Preencha o Nome de Usuário.');
            return;
        }
        if (!loginUsuario) {
            alert('Preencha o Login de Usuário.');
            return;
        }
        if (tagsPerfil.length === 0) {
            alert('Adicione pelo menos um Perfil de Setor.');
            return;
        }
        if (!justificativa) {
            alert('Preencha a Justificativa.');
            return;
        }

        const mensagem = `Chamado de inclusão de setor enviado com sucesso!

Nome de Usuário: ${nomeUsuario}
Login de Usuário: ${loginUsuario}

Perfis selecionados: ${tagsPerfil.join(', ')}

Justificativa: ${justificativa}`;

        exibirModal(mensagem);
    });
</script>

</body>
</html>
