<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - GLPI SIGPEC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           RESET E BASE
           ============================================================ */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Open Sans', sans-serif;
            background: #F5F7FB;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ============================================================
           MENU LATERAL (barra azul fixa)
           ============================================================ */
        .menu-lateral {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            padding: 34px 22px;
            gap: 652px;
            width: 162px;
            height: 100vh;
            background: #1A397A;
            flex-shrink: 0;
            position: sticky;
            top: 0;
        }
        .menu-lateral .requisicoes {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 17px;
            width: 118px;
        }
        .menu-lateral .requisicoes .item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            width: 100%;
            color: #FFFFFF;
            font-size: 13px;
            line-height: 16px;
            cursor: pointer;
            text-decoration: none;
            border: none;
            background: none;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        .menu-lateral .requisicoes .item svg {
            width: 18px;
            height: 18px;
            fill: #FFFFFF;
            flex-shrink: 0;
        }
        .menu-lateral .recolher {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #FFFFFF;
            font-size: 14px;
            line-height: 17px;
            cursor: pointer;
        }

        /* ============================================================
           CONTEÚDO PRINCIPAL
           ============================================================ */
        .conteudo {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 20px 20px 20px;
            overflow-y: auto;
            height: 100vh;
        }

        /* Cabeçalho */
        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 12px 13px;
            background: #FFFFFF;
            width: 100%;
            flex-shrink: 0;
            margin-bottom: 20px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .cabecalho .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #000;
        }
        .cabecalho .breadcrumb .home-icon { width: 18px; height: 18px; }
        .cabecalho .usuario-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #000;
            cursor: pointer;
        }

        /* ============================================================
           BARRA DE CATEGORIAS (mini menu lateral dentro do conteúdo)
           ============================================================ */
        .barra-categorias {
            width: 100%;
            max-width: 200px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 4px;
            background: #FFFFFF;
            padding: 0;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .barra-categorias .categoria-titulo {
            padding: 14px 13px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            font-weight: 700;
            font-size: 15px;
            color: #000000;
        }
        .barra-categorias .categoria-item {
            padding: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 13px;
            color: #5B5083;
            cursor: pointer;
            transition: background 0.15s;
            font-family: 'Inter', sans-serif;
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
            width: 100%;
            text-align: left;
        }
        .barra-categorias .categoria-item:hover {
            background: #f0f2f5;
        }
        .barra-categorias .categoria-item.ativo {
            background: #e8ecf1;
            font-weight: 600;
            color: #1A397A;
            border-left: 3px solid #1A397A;
        }
        .barra-categorias .categoria-item:last-child {
            border-bottom: none;
        }

        /* ============================================================
           GRID DE SERVIÇOS
           ============================================================ */
        .grid-servicos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            background: #FFFFFF;
            padding: 20px;
            border-radius: 4px;
            border: 1px solid rgba(0,0,0,0.1);
            flex: 1;
            align-content: start;
        }
        .card-servico {
            background: #E7E7E7;
            border-radius: 3px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            color: inherit;
            border: none;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }
        .card-servico:hover { background: #d0d0d0; }
        .card-servico .titulo-servico {
            font-weight: 700;
            font-size: 12px;
            color: #000;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-servico .descricao-servico {
            font-size: 9px;
            color: #000;
        }
        .card-servico a { text-decoration: none; color: inherit; display: block; }

        /* ============================================================
           RESPONSIVO
           ============================================================ */
        @media (max-width: 992px) {
            .grid-servicos { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 768px) {
            .menu-lateral { width: 60px; padding: 20px 10px; }
            .menu-lateral .requisicoes .item span { display: none; }
            .menu-lateral .recolher span { display: none; }
            .barra-categorias { max-width: 100%; }
            .grid-servicos { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .grid-servicos { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- ========== MENU LATERAL AZUL ========== -->
<div class="menu-lateral">
    <div class="requisicoes">
        <div class="item" style="font-weight: 600;">
            <svg viewBox="0 0 24 24"><path d="M12 1C7.58 1 4 4.58 4 9v3c0 4.42 3.58 8 8 8s8-3.58 8-8v-3c0-4.42-3.58-8-8-8zm0 2c3.31 0 6 2.69 6 6v3c0 3.31-2.69 6-6 6s-6-2.69-6-6v-3c0-3.31 2.69-6 6-6z"/></svg>
            <span>Serviços</span>
        </div>
        <a href="meus-chamados.html" class="item">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
            <span>Meus Chamados</span>
        </a>
        <div class="item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span>FAQ</span>
        </div>
        <div class="item">
            <svg viewBox="0 0 24 24"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/></svg>
            <span>Reservas</span>
        </div>
    </div>
    <div class="recolher">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M11.67 3.87L9.9 2.1 0 12l9.9 9.9 1.77-1.77L3.54 12z"/></svg>
        <span>Recolher Menu</span>
    </div>
</div>

<!-- ========== CONTEÚDO ========== -->
<div class="conteudo">

    <!-- Cabeçalho -->
    <div class="cabecalho">
        <div class="breadcrumb">
            <svg class="home-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home /</span>
            <span style="color:#000;">Serviços</span>
        </div>
        <div class="usuario-dropdown">
            <span>Usuário</span>
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
    </div>

    <!-- Barra de Categorias (mini menu) -->
    <div class="barra-categorias">
        <div class="categoria-titulo">Categorias</div>
        <button class="categoria-item ativo" data-categoria="todos">Ver Todos</button>
        <button class="categoria-item" data-categoria="inclusao">Inclusão</button>
        <button class="categoria-item" data-categoria="exclusao">Exclusão</button>
        <button class="categoria-item" data-categoria="pedidos">Pedidos</button>
    </div>

    <!-- Grid de Serviços -->
    <div class="grid-servicos" id="gridServicos">

        <!-- Cards serão gerados via JavaScript para facilitar filtro -->
        <!-- Os dados estão no script abaixo -->

    </div>
</div>

<script>
    // ============================================================
    // DADOS DOS CARDS
    // ============================================================
    const servicos = [
        {
            categoria: 'inclusao',
            titulo: 'Inclusão de Usuário',
            descricao: 'Abertura de chamado para criar um usuário ao SIGPEC',
            link: 'formulario/novo-usuario.html'
        },
        {
            categoria: 'inclusao',
            titulo: 'Inclusão de Novo Padrão',
            descricao: 'Abertura de chamado para solicitar a inclusão de um padrão de acesso',
            link: 'formulario/novo-padrao.html'
        },
        {
            categoria: 'inclusao',
            titulo: 'Inclusão de Setor',
            descricao: 'Abertura de chamado para alteração de perfil de setor',
            link: 'formulario/novo-setor.html'
        },
        {
            categoria: 'inclusao',
            titulo: 'Ativar Acesso',
            descricao: 'Abertura de chamado para ativar acesso de usuário',
            link: 'formulario/ativar-acesso.html'
        },
        {
            categoria: 'exclusao',
            titulo: 'Exclusão de Padrão',
            descricao: 'Abertura de chamado para excluir um padrão de acesso',
            link: 'formulario/excluir-padrao.html'
        },
        {
            categoria: 'exclusao',
            titulo: 'Exclusão de Setor',
            descricao: 'Abertura de chamado para alteração de perfil de setor',
            link: 'formulario/excluir-setor.html'
        },
        {
            categoria: 'exclusao',
            titulo: 'Desativar Acesso',
            descricao: 'Abertura de chamado para desativar acesso de usuário',
            link: 'formulario/desativar-acesso.html'
        },
        {
            categoria: 'pedidos',
            titulo: 'Solicitação de Relatório',
            descricao: 'Abertura de chamado para solicitar extração de dados',
            link: 'formulario/solicitar-relatorio.html'
        }
    ];

    // ============================================================
    // RENDERIZAÇÃO DOS CARDS
    // ============================================================
    const grid = document.getElementById('gridServicos');

    function renderizarCards(filtro = 'todos') {
        const filtrados = filtro === 'todos'
            ? servicos
            : servicos.filter(s => s.categoria === filtro);

        grid.innerHTML = filtrados.map(s => `
            <a href="${s.link}" class="card-servico">
                <div class="titulo-servico">
                    <svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    ${s.titulo}
                </div>
                <div class="descricao-servico">${s.descricao}</div>
            </a>
        `).join('');
    }

    // ============================================================
    // FILTRO POR CATEGORIA (clique nos botões)
    // ============================================================
    document.querySelectorAll('.categoria-item').forEach(btn => {
        btn.addEventListener('click', function() {
            // Remove 'ativo' de todos
            document.querySelectorAll('.categoria-item').forEach(b => b.classList.remove('ativo'));
            this.classList.add('ativo');

            const categoria = this.dataset.categoria;
            renderizarCards(categoria);
        });
    });

    // ============================================================
    // INICIALIZAÇÃO
    // ============================================================
    renderizarCards('todos');
</script>

</body>
</html>
